[package]
name = "macvoxel-egui"
version = "0.1.0"
edition = "2021"
publish = false
description = "egui shell preview for MacVoxel. Does not link the C++/Metal editor."

[dependencies]
eframe = { version = "0.31", features = ["wgpu"] }
egui = "0.31"
glam = "0.29"
rfd = "0.15"
bytemuck = { version = "1.7", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
