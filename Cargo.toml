[package]
name = "macvoxel"
version = "0.0.1"
edition = "2021"
publish = false
description = "MacVoxel voxel editor. The Swift/Metal app lives in legacy/."

[dependencies]
eframe = { version = "0.31", features = ["wgpu"] }
egui = "0.31"
glam = "0.29"
rfd = "0.15"
bytemuck = { version = "1.7", features = ["derive"] }
png = "0.18"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
